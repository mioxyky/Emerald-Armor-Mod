pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

rootProject.name = 'Emerald-Armor-Mod'
include 'common', 'fabric', 'forge'

// Set loom.platform property on project descriptors BEFORE they are configured
// This runs during settings evaluation, before any build.gradle is processed
def forgeDescriptor = project(':forge')
forgeDescriptor.projectDir = file('forge')
forgeDescriptor.buildFileName = 'build.gradle'
forgeDescriptor.properties['loom.platform'] = 'forge'
